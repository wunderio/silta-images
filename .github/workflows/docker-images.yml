name: Build and push docker images

on:
  push:
    branches:
      - master
    paths:
      # Only changes to TAGS files trigger this workflow.
      - '**/**/TAGS'
      # "latest" variants keep a fixed TAGS file, so any change in their
      # folder triggers a rebuild.
      - '*/latest/**'

jobs:
  changed_files:
    name: Get changed tag files
    runs-on: ubuntu-latest
    env:
      BUILD_CURRENT: ${{ github.sha }}
      BUILD_PREVIOUS: ${{ github.event.before }}
    outputs:
      matrix: ${{ steps.changes.outputs.matrix}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get changed TAGS files
        id: changes
        run: |
          changed_files=$(git diff-tree --no-commit-id --name-only -r  \
            $BUILD_CURRENT $BUILD_PREVIOUS)
          tagfile_list_json=$( {
              echo "$changed_files" | grep TAGS$ || true
              # Any change in a "latest" variant folder rebuilds that variant
              echo "$changed_files" | grep -E '^[^/]+/latest/' | cut -d/ -f1-2 | sed 's|$|/TAGS|' || true
            } \
            | sort -u \
            | while read -r tagsfile; do [ -f "$tagsfile" ] && echo "$tagsfile"; done \
            | jq -Rsc '. / "\n" - [""]' )
          echo "matrix=${tagfile_list_json}" > $GITHUB_OUTPUT

  build_and_push_docker_hub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest

    # Secrets
    # DOCKER_HUB_REGISTRY_URL: "wunderio"
    env:
      DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
      DOCKER_USER: ${{secrets.DOCKER_USER}}
      DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}

    needs: changed_files
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.changed_files.outputs.matrix) }}
    if: ${{ needs.changed_files.outputs.matrix && needs.changed_files.outputs.matrix != '[]' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: docker login
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Login to DHI registry
        run: echo "$DOCKER_PASSWORD" | docker login dhi.io -u "$DOCKER_USER" --password-stdin

      - name: Build and push images
        run: |
          set -ex
          
          tagsFilePath=${{matrix.dockerfile}}
          
          # Remove "/TAGS" from the path
          folder=${tagsFilePath%"/TAGS"}; 
          
          # Split first two directores and use as image name and tag respectively.
          # This only works with bash, make sure the shell is correct!
          read IMAGE_NAME LEFTOVERS <<<$(IFS="/"; echo $folder);

          # Read TAGS file, tag image with each tag and push to remote
          IMAGE_ID=$DOCKER_REGISTRY_URL/$IMAGE_NAME

          # Build once with a temporary local tag.
          BUILD_TAG="$IMAGE_ID:__ci_build"
          docker build $folder --file $folder/Dockerfile --tag "$BUILD_TAG"

          # Functional gate: if the image declares a HEALTHCHECK, run it and
          # wait until the container reports "healthy" before pushing.
          hasHealthcheck=$(docker inspect --format '{{if .Config.Healthcheck}}yes{{end}}' "$BUILD_TAG")

          if [ -f "$folder/healthcheck.sh" ] && [ "$hasHealthcheck" != "yes" ]; then
            echo "::error::$folder ships healthcheck.sh but the built image declares no HEALTHCHECK. Add a HEALTHCHECK instruction to $folder/Dockerfile, or remove the script."
            exit 1
          fi

          if [ "$hasHealthcheck" != "yes" ]; then
            echo "::notice::$IMAGE_NAME ($folder) declares no HEALTHCHECK - the wait-for-healthy gate is skipped for this image."
          fi

          if [ "$hasHealthcheck" = "yes" ]; then
            echo "Image declares a HEALTHCHECK, verifying it becomes healthy..."
            containerName="ci_healthcheck_$RANDOM"
            docker run -d --rm --name "$containerName" -e ALLOW_EMPTY_PASSWORD=yes "$BUILD_TAG"

            healthy=false
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$containerName" 2>/dev/null || echo "gone")
              echo "  attempt $i: health=$status"
              if [ "$status" = "healthy" ]; then
                healthy=true
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "gone" ]; then
                break
              fi
              sleep 3
            done

            if [ "$healthy" != "true" ]; then
              echo "Image failed to become healthy, refusing to push."
              docker logs "$containerName" 2>&1 | tail -50 || true
              docker rm -f "$containerName" >/dev/null 2>&1 || true
              exit 1
            fi

            echo "Image is healthy."
            docker rm -f "$containerName" >/dev/null 2>&1 || true
          fi

          cat $tagsFilePath | while read TAG || [[ -n $TAG ]];
          do
            # Tag the verified build and push to remote
            docker tag "$BUILD_TAG" $IMAGE_ID:$TAG
            docker push $IMAGE_ID:$TAG
          done;

  # Map changed images to the downstream projects that actually consume them,
  # using the routing map in test-matrix.yml. Images not listed in the map
  # produce no test pipeline. Services that are disabled by default in the
  # charts are enabled via extra silta config files living in the project
  # repos (silta/silta-test-<service>.yml), and the freshly released image
  # tag is injected with helm --set-string so the deployment tests exactly
  # the image that was pushed.
  test_plan:
    name: Plan downstream tests
    runs-on: ubuntu-latest
    needs:
      - changed_files
      - build_and_push_docker_hub
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Map changed images to downstream test pipelines
        id: plan
        env:
          CHANGED_TAGS: ${{ needs.changed_files.outputs.matrix }}
        run: |
          set -e

          # For each changed TAGS file: look up its routing (a variant-level
          # entry images.<image>/<variant> wins over the image-level fallback
          # images.<image>; unmapped variants are skipped) and pass the
          # released tag — the most specific (last) line of the TAGS file —
          # to the test deployment.
          entries="[]"
          while read -r tagsfile; do
            [ -z "$tagsfile" ] && continue
            [ -f "$tagsfile" ] || continue  # TAGS file was deleted
            image=$(echo "$tagsfile" | cut -d/ -f1)
            variant=$(echo "$tagsfile" | cut -d/ -f2)
            mapping=$(yq -o=json ".images.\"${image}/${variant}\" // .images.\"${image}\" // {}" test-matrix.yml)
            if [ "$mapping" = "{}" ]; then
              echo "No downstream test mapped for ${image}/${variant}, skipping"
              continue
            fi
            tag=$(grep -vE '^[[:space:]]*$' "$tagsfile" | tail -1 | tr -d '[:space:]')

            entries=$(echo "$entries" | jq -c \
              --argjson m "$mapping" --arg image "$image" --arg variant "$variant" --arg tag "$tag" '
              . + [ $m | to_entries[] | {
                repo: .key,
                variant: ($image + "/" + $variant),
                extra_config: (if ((.value.config // []) | length) > 0
                               then "," + ((.value.config // []) | join(","))
                               else "" end),
                helm_flags: (
                  if .value.tag_key then "--set-string \(.value.tag_key)=\($tag)"
                  elif .value.image_ref_key then "--set-string \(.value.image_ref_key)=wunderio/\($image):\($tag)"
                  else "" end) } ]')
          done <<< "$(echo "$CHANGED_TAGS" | jq -r '.[]')"

          # Resolve org/branch and drop duplicate trigger payloads (e.g. two
          # base images that both just rebuild the same project).
          matrix=$(yq -o=json '.projects' test-matrix.yml | jq -c --argjson entries "$entries" '
            . as $projects |
            [ $entries[] | . + {org: $projects[.repo].org, branch: $projects[.repo].branch} ]
            | unique_by([.repo, .extra_config, .helm_flags])')

          echo "Test plan: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  circleci-k8s-test-build:
    name: Test released images
    runs-on: ubuntu-latest
    needs: test_plan
    if: ${{ needs.test_plan.outputs.matrix && needs.test_plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      # Serialize: parallel triggers could run concurrent helm upgrades of
      # the same project environment (e.g. two variants of one image
      # released together) and fail on the helm release lock.
      max-parallel: 1
      matrix:
        project: ${{ fromJson(needs.test_plan.outputs.matrix) }}
    steps:
      - name: Validate ${{ matrix.project.variant }} with ${{ matrix.project.repo }}
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_DEV_API_TOKEN }}
        run: |
          REPO_NAME="${{ matrix.project.repo }}"
          ORG_NAME="${{ matrix.project.org }}"
          BRANCH_NAME="${{ matrix.project.branch }}"
          EXTRA_CONFIG="${{ matrix.project.extra_config }}"
          HELM_FLAGS="${{ matrix.project.helm_flags }}"

          if [ -z "${CIRCLECI_TOKEN}" ]; then
            echo "Repository secrets is missing CIRCLECI_DEV_API_TOKEN variable."
            exit 1
          fi

          # Call the CircleCI API, leaving the body in $RESPONSE_FILE and
          # printing the HTTP status. Uses the Circle-Token header instead of
          # Basic auth so token length (base64 line wrapping) doesn't matter.
          RESPONSE_FILE=$(mktemp)
          circleci_api() {
            curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --header "Circle-Token: ${CIRCLECI_TOKEN}" \
              --header "content-type: application/json" \
              "$@" || true
          }

          echo "Running ${ORG_NAME}/${REPO_NAME}/${BRANCH_NAME} build on CircleCI"
          echo "Project link: https://app.circleci.com/pipelines/github/${ORG_NAME}/${REPO_NAME}?branch=${BRANCH_NAME}"

          # Pass extra silta config files (enabling default-disabled services)
          # via test_silta_config, and the released image tag via
          # test_helm_flags. Only send non-empty parameters so projects that
          # have not declared them yet still work for plain test runs.
          PARAMS=$(jq -nc --arg config "$EXTRA_CONFIG" --arg flags "$HELM_FLAGS" '{}
            | (if $config != "" then . + {test_silta_config: $config} else . end)
            | (if $flags != "" then . + {test_helm_flags: $flags} else . end)')
          if [ "$PARAMS" = "{}" ]; then
            BODY=$(jq -nc --arg branch "$BRANCH_NAME" '{branch: $branch}')
          else
            echo "Pipeline parameters: ${PARAMS}"
            BODY=$(jq -nc --arg branch "$BRANCH_NAME" --argjson params "$PARAMS" \
              '{branch: $branch, parameters: $params}')
          fi

          # Trigger a new pipeline
          HTTP_STATUS=$(circleci_api --request POST --data "${BODY}" \
            --url "https://circleci.com/api/v2/project/gh/${ORG_NAME}/${REPO_NAME}/pipeline")
          PIPELINE_ID=$(jq -r '.id // empty' "$RESPONSE_FILE" 2>/dev/null || true)

          if [ "${HTTP_STATUS:0:1}" != "2" ] || [ -z "$PIPELINE_ID" ]; then
            echo "::error::Failed to create pipeline (HTTP ${HTTP_STATUS})."
            echo "Response body:"
            cat "$RESPONSE_FILE"; echo
            case "$HTTP_STATUS" in
              401|403) echo "Note: CIRCLECI_DEV_API_TOKEN is likely expired, revoked or lacks access to ${ORG_NAME}/${REPO_NAME}." ;;
              400)
                echo "Note: if the error mentions pipeline parameters, the project"
                echo "has not declared the test_silta_config/test_helm_flags"
                echo "parameters yet. See automation/image-testing.md."
                ;;
            esac
            exit 1
          fi

          echo "Pipeline ID: ${PIPELINE_ID}"

          sleep 10

          # Wait for pipeline to be complete
          while true; do
            HTTP_STATUS=$(circleci_api --request GET \
              --url "https://circleci.com/api/v2/pipeline/${PIPELINE_ID}/workflow")
            PIPELINE_STATUS=$(jq -r '.items[0].status' "$RESPONSE_FILE" 2>/dev/null || true)
            if [ "${HTTP_STATUS:0:1}" != "2" ] || [ -z "${PIPELINE_STATUS}" ]; then
              echo "::error::Failed to get pipeline status (HTTP ${HTTP_STATUS})."
              echo "Response body:"
              cat "$RESPONSE_FILE"; echo
              exit 1
            fi
            if [ "${PIPELINE_STATUS}" = "success" ]; then
              echo "Pipeline completed successfully"
              break
            elif [ "${PIPELINE_STATUS}" != "created" ] && [ "${PIPELINE_STATUS}" != "running" ]; then
              echo "Pipeline status: ${PIPELINE_STATUS}, failing the test"
              exit 1
            fi
            echo "current status: ${PIPELINE_STATUS}"
            sleep 10
          done