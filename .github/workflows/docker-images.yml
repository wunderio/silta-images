name: Build and push docker images

on:
  push:
    branches:
      - master
    paths:
      - '**/**/TAGS'

jobs:
  changed_files:
    name: Get changed tag files
    runs-on: ubuntu-latest
    env:
      BUILD_CURRENT: ${{ github.sha }}
      BUILD_PREVIOUS: ${{ github.event.before }}
    outputs:
      matrix: ${{ steps.changes.outputs.matrix}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get changed TAGS files
        id: changes
        run: |
          tagfile_list_json=$(git diff-tree --no-commit-id --name-only -r  \
            $BUILD_CURRENT $BUILD_PREVIOUS \
            | grep TAGS$ \
            | jq -Rsc '. / "\n" - [""]' )
          echo "matrix=${tagfile_list_json}" > $GITHUB_OUTPUT

  build_and_push_docker_hub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest

    # Secrets
    # DOCKER_HUB_REGISTRY_URL: "wunderio"
    env:
      DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
      DOCKER_USER: ${{secrets.DOCKER_USER}}
      DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}

    needs: changed_files
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.changed_files.outputs.matrix) }}
    if: ${{needs.changed_files.outputs.matrix}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: docker login
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_PASSWORD  

      - name: Build and push images
        run: |
          set -ex
          
          tagsFilePath=${{matrix.dockerfile}}
          
          # Remove "/TAGS" from the path
          folder=${tagsFilePath%"/TAGS"}; 
          
          # Split first two directores and use as image name and tag respectively.
          # This only works with bash, make sure the shell is correct!
          read IMAGE_NAME LEFTOVERS <<<$(IFS="/"; echo $folder);

          # Read TAGS file, tag image with each tag and push to remote
          IMAGE_ID=$DOCKER_REGISTRY_URL/$IMAGE_NAME
          cat $tagsFilePath | while read TAG || [[ -n $TAG ]];
          do
            # Add tags
            docker build $folder --file $folder/Dockerfile --tag $IMAGE_ID:$TAG
            # Push image
            docker push $IMAGE_ID:$TAG
          done;

  # Map changed images to the downstream projects that actually consume them,
  # using the routing map in test-matrix.yml. Images not listed in the map
  # produce no test pipeline. Services that are disabled by default in the
  # charts are enabled for the test deployment via helm --set flags.
  test_plan:
    name: Plan downstream tests
    runs-on: ubuntu-latest
    needs:
      - changed_files
      - build_and_push_docker_hub
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Map changed images to downstream test pipelines
        id: plan
        env:
          CHANGED_TAGS: ${{ needs.changed_files.outputs.matrix }}
        run: |
          set -e

          # Unique image names: first path segment of each changed TAGS file.
          images=$(echo "$CHANGED_TAGS" | jq -r '.[]' | cut -d'/' -f1 | sort -u)
          echo "Changed images: $(echo "$images" | tr '\n' ' ')"

          # Aggregate the services to enable per project repo.
          plan="{}"
          while read -r image; do
            [ -z "$image" ] && continue
            entries=$(yq -o=json ".images.\"${image}\" // {}" test-matrix.yml)
            while read -r repo; do
              [ -z "$repo" ] && continue
              services=$(echo "$entries" | jq -c --arg r "$repo" '.[$r] // []')
              plan=$(echo "$plan" | jq -c --arg r "$repo" --argjson s "$services" \
                '.[$r] = ((.[$r] // []) + $s | unique)')
            done <<< "$(echo "$entries" | jq -r 'keys[]')"
          done <<< "$images"

          # Resolve org/branch and turn service lists into helm flags.
          matrix=$(yq -o=json '.projects' test-matrix.yml | jq -c --argjson plan "$plan" '
            [ to_entries[]
              | select($plan[.key] != null)
              | { repo: .key,
                  org: .value.org,
                  branch: .value.branch,
                  helm_flags: ([ $plan[.key][] | "--set \(.).enabled=true" ] | join(" ")) } ]')

          echo "Test plan: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  circleci-k8s-test-build:
    name: Test released images
    runs-on: ubuntu-latest
    needs: test_plan
    if: ${{ needs.test_plan.outputs.matrix && needs.test_plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.test_plan.outputs.matrix) }}
    steps:
      - name: Validate released images with ${{ matrix.project.repo }}
        run: |
          REPO_NAME="${{ matrix.project.repo }}"
          ORG_NAME="${{ matrix.project.org }}"
          BRANCH_NAME="${{ matrix.project.branch }}"
          HELM_FLAGS="${{ matrix.project.helm_flags }}"
          CIRCLECI_DEV_API_TOKEN_B64=$(echo -n "${{ secrets.CIRCLECI_DEV_API_TOKEN }}:" | base64)

          if [ -z "${{ secrets.CIRCLECI_DEV_API_TOKEN }}" ]; then
            echo "Repository secrets is missing CIRCLECI_DEV_API_TOKEN variable."
            exit 1
          fi

          echo "Running ${ORG_NAME}/${REPO_NAME}/${BRANCH_NAME} build on CircleCI"
          echo "Project link: https://app.circleci.com/pipelines/github/${ORG_NAME}/${REPO_NAME}?branch=${BRANCH_NAME}"

          # Pass extra helm flags (enabling default-disabled services) via the
          # test_helm_flags pipeline parameter. Only send the parameter when
          # non-empty so projects that have not declared it yet still work
          # for plain (no extra services) test runs.
          if [ -n "$HELM_FLAGS" ]; then
            echo "Enabling services for test deployment: ${HELM_FLAGS}"
            BODY=$(jq -nc --arg branch "$BRANCH_NAME" --arg flags "$HELM_FLAGS" \
              '{branch: $branch, parameters: {test_helm_flags: $flags}}')
          else
            BODY=$(jq -nc --arg branch "$BRANCH_NAME" '{branch: $branch}')
          fi

          # Trigger a new pipeline
          PIPELINE_RESPONSE=$(curl --request POST \
            --url "https://circleci.com/api/v2/project/gh/${ORG_NAME}/${REPO_NAME}/pipeline" \
            --header "content-type: application/json" \
            --data "${BODY}" \
            --header "authorization: Basic ${CIRCLECI_DEV_API_TOKEN_B64}" --silent)
          PIPELINE_ID=$(echo "$PIPELINE_RESPONSE" | jq -r '.id')

          if [ -z "$PIPELINE_ID" ] || [ "$PIPELINE_ID" = "null" ]; then
            echo "Failed to create pipeline. Response:"
            echo "$PIPELINE_RESPONSE" | jq .
            echo "Note: if the error mentions pipeline parameters, the project"
            echo "has not declared the test_helm_flags parameter yet."
            echo "See docs/image-testing.md."
            exit 1
          fi

          echo "Pipeline ID: ${PIPELINE_ID}"

          sleep 10

          # Wait for pipeline to be complete
          while true; do
            PIPELINE_STATUS=$(curl --request GET \
              --url "https://circleci.com/api/v2/pipeline/${PIPELINE_ID}/workflow" \
              --header "authorization: Basic ${CIRCLECI_DEV_API_TOKEN_B64}" --silent | jq -r '.items[0].status')
            if [ "${PIPELINE_STATUS}" = "success" ]; then
              echo "Pipeline completed successfully"
              break
            elif [ "${PIPELINE_STATUS}" != "created" ] && [ "${PIPELINE_STATUS}" != "running" ]; then
              echo "Pipeline status: ${PIPELINE_STATUS}, failing the test"
              exit 1
            fi
            echo "current status: ${PIPELINE_STATUS}"
            sleep 10
          done